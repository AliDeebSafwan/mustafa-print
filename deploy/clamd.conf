# ClamAV daemon settings for the shop's upload scanning. Mounted into the clamav container by compose.yaml.
# Every directive below was exercised against a real clamd 1.5 while building this.

TCPSocket 3310
TCPAddr 0.0.0.0            # reachable only on the compose network; compose.yaml never publishes this port
Foreground yes
User clamav

# The API accepts designs up to 100 MB. clamd must accept AND scan at least that much, with room to spare.
StreamMaxLength 110M
MaxFileSize 110M
MaxScanSize 220M

# IMPORTANT. With clamd's defaults, a file bigger than the scan limits is reported "OK" without being scanned at
# all (tested: a 2 MB file containing the standard test virus came back clean under a 1 MB limit). Padding a
# malicious file past the limit would then walk straight through. This makes clamd flag such a file instead, and
# the API refuses it.
AlertExceedsMax yes
