<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101418" />
    <meta name="robots" content="noindex" />
    <title>مطبعة المصطفى | الإدارة</title>
    <!-- Applies the device's chosen theme before the first paint (see src/lib/theme.ts; keep the key in step). -->
    <script>try { if (localStorage.getItem('mpe.theme') === '2100') { document.documentElement.dataset.theme = '2100'; document.querySelector('meta[name="theme-color"]').content = '#090d16' } } catch (e) {}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
